# Floor Mop default configuration.
# Every value here is a placeholder default, tuned in session.
# Secrets never go in this file. Supply them via environment variables.

[logging]
level = "INFO"
dir = "logs"
# Rotate the log file after it reaches this many bytes (10 MiB).
max_bytes = 10485760
# Number of rotated log files to keep.
backup_count = 5
# Also emit log records to the console.
console = true

[paths]
data_dir = "data"
